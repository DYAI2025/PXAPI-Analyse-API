[project]
name = "pxapi"
version = "0.1.0"
description = "PXAPI — Pixelkiez Website Analysis Platform (modular monolith scaffold)"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Private :: Do Not Upload",
]
# PXK-67 turns the scaffold into a product: it is the slice that "actually
# implements adapters", which PXK-59 named as the point where framework
# dependencies become legitimate. Each entry is used by exactly one adapter and
# by no inner layer; tests/architecture/boundaries.py keeps them there.
dependencies = [
    # Runtime contract validation. JSON Schema is the single contract authority,
    # so the transport boundary validates against the *same* registry the tests
    # use rather than restating any shape as a Python model. `referencing` is
    # declared in its own right because the registry builder imports it directly.
    "jsonschema>=4.26,<5",
    "referencing>=0.36,<0.37",
    # Inbound transport only: routing, request body, status codes. No contract
    # shape is ever expressed as a Pydantic model.
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    # jsonschema and referencing moved to [project].dependencies in PXK-67: the
    # transport boundary validates at runtime against the same registry, so they
    # are no longer test-only and declaring them here as well would state one
    # fact twice.
    "pytest>=9.1.1",   # test runner; also executes the architecture boundary guard
    "ruff>=0.16.5",    # linter + formatter (AC2)
    "httpx>=0.28,<1",  # starlette TestClient transport; test-only, never imported by src/
]

[build-system]
requires = ["hatchling>=1.27"]   # >=1.27 emits PEP 639 License-Expression; older silently degrades
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pxapi"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]          # lets tests import the tests.architecture helper package
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py313"
src = [".", "src"]
# Frozen prior-slice evidence, deliberately outside this project's lint/format
# scope so A3 tooling can never rewrite it:
#   oracle/       the PXK-15 regression-oracle artifact (reference, not A3 code)
#   docs/evidence per-slice verification records — note ruff formats python code
#                 fences inside .md, so these are in format scope without this rule
# force-exclude makes both bind even when a tool passes a path explicitly
# (pre-commit, `ruff check $(git diff --name-only)`).
# Root README.md stays in scope: it is A3-owned.
# "oracle/*" not "oracle": a pattern without a separator is matched against the
# BASENAME at any depth, which would silently un-lint a future
# src/pxapi/adapters/oracle/ as well.
extend-exclude = ["oracle/*", "docs/evidence"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "RUF"]
